[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nfh-instantiation-agent"
version = "0.1.0"
description = "Governed NFH Fabric infrastructure instantiation agent"
readme = "guides/README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "NFH" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nfh-instantiation-agent = "nfh_instantiation_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["nfh_instantiation_agent", "nfh_instantiation_agent.*"]

[tool.setuptools.package-data]
"nfh_instantiation_agent" = ["policies/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
